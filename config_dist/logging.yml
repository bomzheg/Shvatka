version: 1
formatters:
  simple:
    format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  colored:
    (): colorlog.ColoredFormatter
    format: '%(asctime)s - %(name)s - %(log_color)s%(levelname)s - %(blue)s%(message)s'
    datefmt: '%H:%M:%S'
handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: colored
    stream: ext://sys.stdout
  out:
    class: logging.StreamHandler
    level: DEBUG
    formatter: simple
    stream: ext://sys.stdout
root:
  # every record is written on the event loop thread, and that thread serves
  # every request in the process — so DEBUG here costs latency, not just noise.
  # to debug a subsystem, raise that logger below rather than the root
  level: INFO
  handlers: [console]
loggers:
  pyrogram:
    level: WARNING
disable_existing_loggers: false
