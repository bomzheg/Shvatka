[project]
name = "shvatka"
version = "1.0.0"
description = "Bot and Api for popular night puzzle hunt"
authors = [
    {name = "Yuriy Chebyshev", email = "bomzheg@gmail.com"},
]
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.14,<3.16"
dependencies = [
    "pyyaml>=6.0,<7.0",
    "python-dateutil>=2.8.2,<3.0",
    "colorlog>=6.7.0,<7.0",
    "aiogram>=3.30.0,<3.31.0",
    "pydantic>=2.11,<3.0",
    "aiogram_dialog[tools]>=2.6,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "alembic>=1.10.0,<2.0",
    "asyncpg>=0.27.0,<1.0",
    "ujson>=5.5.0,<6.0",
    "redis>=5.0.1,<6.0",
    "pyrogram>=2.0.57,<3.0",
    "adaptix==3.0.0b12",
    "dature[yaml]>=1.1.1,<2.0",
    "apscheduler>=3.9.1,<4.0",
    "fastapi==0.111.1",
    "uvicorn>=0.30.0,<0.31.0",
    # uvicorn only uses uvloop if it can import it, and the plain uvicorn
    # dependency does not bring it. a single process serves every request,
    # so its per-request overhead is on the critical path of all of them
    "uvloop>=0.19,<1.0; sys_platform != 'win32' and platform_python_implementation == 'CPython'",
    "python-multipart>=0.0.5,<0.1.0",
    "python-jose[cryptography]>=3.3.0,<4.0",
    "passlib>=1.7.4,<2.0",
    "bcrypt==4.0.1",
    "telegraph[aio]>=2.2.0,<3.0",
    "openpyxl>=3.0.10,<4.0",
    "lxml>=6.0.0,<7.0",
    "matplotlib>=3.7.1,<4.0",
    "greenlet<4.0.0",
    "dishka==1.5.2",
    "asgi-monitor>=0.4.0,<0.5.0",
    "pywebpush>=2.3,<3.0",
    "python-magic>=0.4.27,<0.5.0",
    "aiosmtplib>=3.0,<4.0",
    "pillow>=10.1,<13.0",
    "pillow-heif>=1.0,<2.0",
]

[dependency-groups]
dev = [
    "locust>=2.15.1,<3",
    "python-magic-bin>=0.4.14; sys_platform == 'win32' or sys_platform == 'darwin'",
    "TgCrypto>=1.2.5",  # for shut up pyro when local start (don't care on prod)
]
test = [
    "pytest>=7.2.0,<8.0",
    "pytest-ordering>=0.6,<0.7",
    "pytest-asyncio>=0.18.3,<0.19",
    "pytest-cov",
    "testcontainers>=4.5.1,<5.0",
    "httpx>=0.23.0,<0.24.0",
    "coverage[toml]",
    "ruff>=0.2.1,<0.3",
    "types-python-dateutil>=2.8.19,<3.0",
    "types-redis>=4.3.21,<5.0",
    "types-PyYAML>=6.0.12,<7.0",
    "lxml-stubs>=0.4.0,<0.5",
    "types-openpyxl",
    "types-python-jose",
    "types-passlib",
    "mypy>=1.1.1,<2.0",
    "asgi-lifespan>=2.1.0,<3.0",
]

[project.scripts]
shvatka-tgbot = "shvatka.tgbot.__main__:run"
shvatka-api = "shvbatka.api.__main__:run"
shvatka-file-id-updater = "shvatka.infrastructure.file_id_updater:run"
shvatka-empty-file-repairer = "shvatka.infrastructure.empty_file_repairer:run"
shvatka-player-username-updater = "shvatka.infrastructure.player_username_updater:run"
shvatka-password = "shvatka.api.password_hash:generate"
shvatka-member-tags-backfill = "shvatka.tgbot.member_tags_backfill:run"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["shvatka"]

[tool.coverage.run]
branch = true
relative_files = true
include = ["shvatka/**"]
omit = [
    ".*",
    "*/site-packages/*",
    "shvatka/tgbot/*",
    "shvatka/infrastructure/db/migrations/*",
    "*/__main__.py",
    # One-shot scripts: run by hand (or once, on a single deploy), talking to a
    # foreign site or to prod data. They are not part of the product's
    # behaviour and nobody is going to write tests for them, so measuring them
    # only skews the numbers.
    #
    # the forum crawler: logs into the old engine, parses its HTML and uploads
    # scenarios back. Its models/ stay measured — the DAO layer uses them.
    "shvatka/infrastructure/crawler/auth.py",
    "shvatka/infrastructure/crawler/constants.py",
    "shvatka/infrastructure/crawler/factory.py",
    "shvatka/infrastructure/crawler/retort.py",
    "shvatka/infrastructure/crawler/game_scn/*",
    "shvatka/infrastructure/crawler/teams/*",
    # one-time migration of stored scenarios from format 0 to 1
    "shvatka/core/migration_utils/*",
    # maintenance scripts over prod data
    "shvatka/infrastructure/empty_file_repairer.py",
    "shvatka/infrastructure/file_id_updater.py",
    "shvatka/infrastructure/stored_scn_checker.py",
]

[tool.coverage.report]
# The floor for the whole measured codebase. With branch = true this single
# number covers both: coverage counts every branch as a measurable thing next
# to the statements, so a PR that adds untested branches drags it down too.
# The full suite gives ~80% today — raise this as the number grows, don't lower
# it to make a red build green. It only applies where coverage runs at all, so
# the fast local loop (pytest tests/unit, no --cov) is unaffected.
fail_under = 78
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "class .*\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "(typing\\.)?assert_never",
]

[tool.black]
line-length = 99
target-version = ['py310', 'py311']
include_trailing_comma = true
exclude = '''
(
    \.eggs
  | \.git
  | \.tox
  | build
  | dist
  | venv
  | docs
  | .idea
)
'''

[tool.ruff]
line-length = 99
# ruff 0.2 cannot parse `requires-python = ">=3.14"`, so without this it silently
# falls back to py38 and turns on rules we do not need (FA100/FA102) while
# holding back the py39+ rewrites. py312 is the newest this ruff knows.
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Deliberate, not a backlog. Every entry here says "we disagree with the
    # rule", not "we have not got round to it" — an entry that only means the
    # latter belongs in the fixme block below, so it can be paid off.
    "D",  # docstrings are written where they earn their keep, not everywhere
    "S101",  # asserts narrow types for mypy, they are not input validation
    "RUF001", "RUF002",  # the domain (and half the strings) is in Russian
    "EM101", "EM102", "TRY003",  # exception messages read fine inline
    "ISC001", "COM812",  # both fight `ruff format`
    "FIX002", "TD002", "TD003", "TD004", "TD005",  # TODOs need no ceremony
    "ANN101", "ANN102",  # deprecated upstream: self/cls need no annotation
    "TRY301",  # the raise-in-try shape is deliberate where it is used
    # an if/elif/else chain that returns from every arm is a set of parallel
    # branches, not a guard clause — keep it readable as one
    "RET505",
    # `type X = ...` builds a lazy TypeAliasType: it is not callable, so
    # `SHKey("SH123")` breaks, and adaptix cannot resolve it either
    "UP040",
    # dishka and pydantic read annotations at runtime, so an import moved into
    # a TYPE_CHECKING block breaks DI wiring and response models
    "TCH001", "TCH002", "TCH003",

    # fixme — worth fixing, just not fixed yet
    "ANN201", "PLR0913", "ANN401", "ANN001", "PLR0911", "FBT001",
    "ANN003", "ARG002", "ARG001", "FBT002", "N818",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"asyncio.create_task".msg = "spawn detached work through the app Nursery (shvatka.core.interfaces.nursery) instead"
"asyncio.ensure_future".msg = "spawn detached work through the app Nursery (shvatka.core.interfaces.nursery) instead"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# a portable copy of aiogram's webhook handler, kept self-contained (and close
# to upstream) so it can be pasted into another bot — it must not reach into
# shvatka, so it manages its own background updates
"shvatka/tgbot/utils/fastapi_webhook.py" = ["TID251"]
# a test may reach into the object under test, hard-code a fake secret and
# compare against a literal — that is the point of a test, not a smell
"tests/*" = [
    "S105", "S106", "S311", "SLF001", "PLR2004", "PLR0913",
    "PT004", "PT023", "PT001", "PLR0915", "ARG001", "ARG005", "PTH123",
    "ANN202", "BLE001",  # fixme
]
"tests/**/conftest.py" = ["F811"]
"shvatka/api/*" = ["B008"]
"**/migrations/versions/*" = ["N999"]
# the forum crawler is a one-shot import of another engine's HTML: it parses
# naive local timestamps and counts columns, and nobody is going to rework it
"**/crawler/**parser/*" = ["PLR0912", "B904", "DTZ007", "PLR2004"]
"shvatka/infrastructure/crawler/teams/parse_teams.py" = ["DTZ007"]
"shvatka/infrastructure/db/models/*" = ["RUF012"]
"tests/manual/files.py" = ["T201"]

[tool.mypy]
no_implicit_optional = true
warn_unused_ignores = true
show_error_codes = true
exclude = ['venv', '.venv']

[[tool.mypy.overrides]]
module = "tests.*"
disable_error_code = ["union-attr", "arg-type"]

[[tool.mypy.overrides]]
module = "shvatka.infrastructure.crawler.*"
disable_error_code = ["union-attr", "arg-type", "index", "misc", "assignment"]

[[tool.mypy.overrides]]
module = "tests.manual.*"
disable_error_code = ["import-untyped"]

# still shipped without type information; matplotlib, aiogram_tests and
# diagrams used to be here and are typed now, so they are gone from the list
[[tool.mypy.overrides]]
module = [
    "telegraph.*",
    "apscheduler.*",
    "testcontainers.*",
    "pywebpush.*",
    "pillow_heif.*",
]
ignore_missing_imports = true
